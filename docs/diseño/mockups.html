<title>Agencia Hub Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: página de revisión (canvas) con un escenario que muestra cada pantalla en escritorio e iPhone lado a lado.
   Diseño de un solo mundo visual (el de la app): colores explícitos, sin tema oscuro a propósito. */
:root {
  --color-primary: #F69008; --color-primary-dark: #D97706; --color-primary-light: #FEF3C7;
  --color-ink: #13243D; --color-ink-soft: #1C3150; --color-leaf: #2F5D8A; --color-cta: #60D0FA;
  --color-canvas: #F6F4F0; --color-surface: #FFFFFF; --color-line: #E4E0D8; --color-muted: #5E6878;
  --color-sidebar-text: #C9D3E0; --color-danger: #B42318; --color-danger-light: #FDECEA;
  --color-warning: #B54708; --color-warning-light: #FEF0E1; --color-success: #1E7F4F; --color-success-light: #E6F4EC;
  --color-presence: #2BAC76;
  --font-body: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Bricolage Grotesque', 'Roboto', system-ui, sans-serif;
  --shadow-sm: 0 1px 2px rgb(19 36 61 / .08); --shadow-md: 0 4px 14px rgb(19 36 61 / .12); --shadow-lg: 0 12px 32px rgb(19 36 61 / .18);
  color-scheme: light;
}
*, *::before, *::after { border-radius: 0 !important; box-sizing: border-box; }
.presence { border-radius: 50% !important; }
html, body { background: var(--color-canvas); color: var(--color-ink); }
body { font-family: var(--font-body); font-size: 14px; padding-inline: 16px; padding-block: 24px 48px; }
.lucide { width: 16px; height: 16px; stroke-width: 2; flex: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ── Página de revisión ── */
.review { max-width: 1440px; margin: 0 auto; display: grid; gap: 20px; }
.review-head { display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: end; justify-content: space-between; }
.review-head h1 { font-family: var(--font-display); font-size: 1.75rem; margin: 0; text-wrap: balance; }
.review-head p { margin: 4px 0 0; color: var(--color-muted); max-width: 62ch; line-height: 1.5; }
.gate { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--color-primary); color: var(--color-ink); font-weight: 500; font-size: 13px; }
.tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--color-line); }
.tabs button { padding: 10px 14px; font-weight: 500; color: var(--color-muted); border-bottom: 3px solid transparent; display: flex; gap: 8px; align-items: center; transition: color 160ms, border-color 160ms; }
.tabs button:hover { color: var(--color-ink); }
.tabs button[aria-selected="true"] { color: var(--color-ink); border-bottom-color: var(--color-primary); }
.tabs .num { font-size: 11px; color: var(--color-muted); font-variant-numeric: tabular-nums; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 24px; align-items: start; }
@media (max-width: 980px) { .stage { grid-template-columns: minmax(0, 1fr); } }
figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
figcaption { font-size: 12px; color: var(--color-muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
.scaler { position: relative; overflow: hidden; box-shadow: var(--shadow-lg); background: var(--color-surface); }
.scaler > .app { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.phone-wrap { justify-self: center; width: 100%; max-width: 330px; }
.phone-wrap .scaler { border: 10px solid var(--color-ink); box-shadow: var(--shadow-lg); }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 32px; padding-top: 8px; border-top: 1px solid var(--color-line); }
.notes h2 { font-family: var(--font-display); font-size: 1.05rem; margin: 0 0 6px; }
.notes ul { margin: 0; padding-left: 18px; line-height: 1.55; color: #2A3A52; }
.notes li { margin-bottom: 4px; }

/* ══════════ APP ══════════ */
.app { font-family: var(--font-body); font-size: 14px; color: var(--color-ink); background: var(--color-canvas); overflow: hidden; }
.app.desktop { width: 1280px; height: 800px; display: grid; grid-template-columns: 64px 260px minmax(0, 1fr) auto; }
.app.mobile { width: 390px; height: 844px; display: grid; grid-template-rows: 47px auto minmax(0, 1fr) auto; }

/* Riel de workspaces */
.rail { background: var(--color-ink-soft); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 0; }
.ws { width: 40px; height: 40px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 15px; background: var(--color-primary); color: var(--color-ink); position: relative; }
.ws.other { background: #2B4467; color: #fff; }
.ws.active::before { content: ''; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 4px; background: #fff; }
.ws.add { background: transparent; border: 1px dashed #5B7193; color: var(--color-sidebar-text); }
.ws .dot { position: absolute; right: -4px; top: -4px; width: 10px; height: 10px; background: var(--color-primary); border: 2px solid var(--color-ink-soft); }

/* Sidebar */
.sidebar { background: linear-gradient(180deg, var(--color-ink) 0%, #0F1E34 100%); color: var(--color-sidebar-text); display: flex; flex-direction: column; min-height: 0; }
.sb-head { padding: 14px 16px 10px; display: grid; gap: 10px; border-bottom: 1px solid rgb(255 255 255 / .08); }
.sb-ws { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 700; font-size: 17px; color: #fff; }
.dd { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .12); color: #fff; font-size: 13px; }
.dd small { color: var(--color-sidebar-text); font-size: 12px; }
.sb-search { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: rgb(0 0 0 / .18); font-size: 13px; }
.kbd { margin-left: auto; font-size: 11px; padding: 1px 5px; border: 1px solid rgb(255 255 255 / .2); color: var(--color-sidebar-text); font-family: var(--font-body); }
.sb-scroll { overflow: hidden; padding: 8px 0 16px; display: grid; gap: 12px; align-content: start; }
.sb-sec h4 { margin: 0; padding: 4px 16px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: #8FA0B8; display: flex; align-items: center; gap: 6px; }
.sb-item { display: flex; align-items: center; gap: 8px; padding: 5px 16px; font-size: 14px; position: relative; transition: background 160ms; }
.sb-item:hover { background: var(--color-ink-soft); }
.sb-item.unread { color: #fff; font-weight: 700; }
.sb-item.active { background: var(--color-ink-soft); color: #fff; }
.sb-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--color-primary); }
.sb-item .lucide { width: 15px; height: 15px; opacity: .85; }
.badge { margin-left: auto; min-width: 20px; padding: 1px 6px; background: var(--color-primary); color: var(--color-ink); font-size: 11px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.sb-item .presence { width: 8px; height: 8px; background: var(--color-presence); flex: none; }
.sb-item .presence.away { background: transparent; border: 1.5px solid #8FA0B8; }
.sb-av { width: 20px; height: 20px; display: grid; place-items: center; font-size: 10px; font-weight: 700; position: relative; }

/* Principal */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--color-canvas); container-type: inline-size; }
.topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: var(--color-surface); border-bottom: 1px solid var(--color-line); }
.topbar h2 { margin: 0; font-family: var(--font-display); font-size: 18px; display: flex; align-items: center; gap: 6px; }
.topbar .topic { color: var(--color-muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.topbar .actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; color: var(--color-ink); border: 1px solid transparent; transition: background 160ms, border-color 160ms; }
.icon-btn:hover { background: var(--color-canvas); border-color: var(--color-line); }
.members { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border: 1px solid var(--color-line); font-size: 13px; }
.stack { display: flex; }
.stack .av { width: 22px; height: 22px; font-size: 9px; margin-left: -4px; border: 2px solid var(--color-surface); }
.stack .av:first-child { margin-left: 0; }

/* Mensajes */
.feed { flex: 1; overflow: hidden; padding: 12px 0 4px; display: flex; flex-direction: column; justify-content: flex-end; }
.day { display: flex; align-items: center; gap: 12px; padding: 8px 20px; font-size: 12px; font-weight: 500; color: var(--color-muted); }
.day::before, .day::after { content: ''; flex: 1; height: 1px; background: var(--color-line); }
.newline { display: flex; align-items: center; gap: 10px; padding: 4px 20px; font-size: 12px; font-weight: 700; color: var(--color-danger); }
.newline::before { content: ''; flex: 1; height: 1px; background: var(--color-danger); order: 2; }
.msg { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; padding: 6px 20px; position: relative; transition: background 160ms; }
.msg:hover { background: rgb(19 36 61 / .03); }
.msg.mention { background: var(--color-primary-light); box-shadow: inset 3px 0 0 var(--color-primary); }
.av { width: 36px; height: 36px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; flex: none; }
.c1 { background: var(--color-leaf); } .c2 { background: var(--color-primary); color: var(--color-ink) !important; } .c3 { background: #5B4B8A; }
.c4 { background: #1E7F4F; } .c5 { background: var(--color-ink-soft); } .c6 { background: #A3412A; }
.msg-head { display: flex; align-items: baseline; gap: 8px; }
.msg-head b { font-weight: 700; }
.msg-head .role { font-size: 11px; padding: 0 5px; background: var(--color-canvas); border: 1px solid var(--color-line); color: var(--color-muted); }
.msg-head time { font-size: 12px; color: var(--color-muted); font-variant-numeric: tabular-nums; }
.msg p { margin: 2px 0 0; line-height: 1.45; }
.msg .edited { color: var(--color-muted); font-size: 12px; }
.at { background: var(--color-primary-light); color: #8A4B00; font-weight: 500; padding: 0 2px; }
.at.me { background: var(--color-primary); color: var(--color-ink); }
a, .link { color: var(--color-leaf); text-decoration: underline; text-underline-offset: 2px; }
code { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 12.5px; background: #EDE9E1; padding: 1px 4px; color: #8A2A1B; }
.reactions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.react { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid var(--color-line); background: var(--color-surface); font-size: 12px; font-variant-numeric: tabular-nums; }
.react.mine { border-color: var(--color-leaf); background: #EAF1F8; color: var(--color-leaf); font-weight: 500; }
.replies { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; padding: 3px 8px 3px 3px; border: 1px solid transparent; font-size: 13px; }
.replies:hover { border-color: var(--color-line); background: var(--color-surface); }
.replies b { color: var(--color-leaf); }
.replies span { color: var(--color-muted); font-size: 12px; }
.replies .av { width: 20px; height: 20px; font-size: 9px; }
.file { display: flex; align-items: center; gap: 10px; margin-top: 6px; padding: 8px 12px; background: var(--color-surface); border: 1px solid var(--color-line); max-width: 340px; box-shadow: var(--shadow-sm); }
.file .ico { width: 34px; height: 40px; display: grid; place-items: center; background: var(--color-danger); color: #fff; font-size: 10px; font-weight: 700; }
.file small { display: block; color: var(--color-muted); font-size: 12px; }
.thumb { margin-top: 6px; width: 240px; height: 140px; background: repeating-linear-gradient(135deg, #E9E4DA 0 10px, #F1EDE6 10px 20px); border: 1px solid var(--color-line); display: grid; place-items: center; color: var(--color-muted); font-size: 12px; }
.hover-menu { position: absolute; right: 20px; top: -14px; display: flex; background: var(--color-surface); border: 1px solid var(--color-line); box-shadow: var(--shadow-md); }
.hover-menu .icon-btn { width: 30px; height: 30px; }
.typing { padding: 2px 20px 6px; font-size: 12px; color: var(--color-muted); height: 22px; }
.typing b { color: var(--color-ink); font-weight: 500; }

/* Compositor */
.composer { margin: 0 20px 16px; background: var(--color-surface); border: 1px solid #C9C3B7; box-shadow: var(--shadow-sm); }
.composer:focus-within { border-color: var(--color-ink); }
.composer .tools { display: flex; gap: 2px; padding: 4px 6px; border-bottom: 1px solid var(--color-line); color: var(--color-muted); }
.composer .tools .icon-btn { width: 28px; height: 28px; color: var(--color-muted); }
.composer .field { padding: 10px 12px; min-height: 42px; color: var(--color-muted); }
.composer .field.filled { color: var(--color-ink); }
.composer .foot { display: flex; align-items: center; gap: 2px; padding: 4px 6px; }
.send { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--color-primary); color: var(--color-ink); font-weight: 700; font-size: 13px; transition: background 160ms; }
.send:hover { background: var(--color-primary-dark); }
.mention-pop { position: absolute; left: 20px; right: 20px; bottom: 100%; margin-bottom: 6px; background: var(--color-surface); border: 1px solid var(--color-line); box-shadow: var(--shadow-lg); }
.mention-pop .opt { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
.mention-pop .opt.on { background: var(--color-ink); color: #fff; }
.mention-pop .opt small { color: var(--color-muted); margin-left: auto; font-size: 12px; }
.mention-pop .opt.on small { color: var(--color-sidebar-text); }
.mention-pop .opt .av { width: 24px; height: 24px; font-size: 10px; }

/* Panel derecho */
.panel { width: 380px; background: var(--color-surface); border-left: 1px solid var(--color-line); display: flex; flex-direction: column; min-height: 0; box-shadow: -6px 0 18px rgb(19 36 61 / .06); }
.panel-head { height: 56px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--color-line); }
.panel-head h3 { margin: 0; font-family: var(--font-display); font-size: 17px; }
.panel-head small { color: var(--color-muted); }
.panel-head .icon-btn { margin-left: auto; }
.panel .feed { background: var(--color-surface); justify-content: flex-start; }
.panel .msg { padding: 8px 20px; }
.sep { display: flex; align-items: center; gap: 10px; padding: 6px 20px; color: var(--color-muted); font-size: 12px; }
.sep::after { content: ''; flex: 1; height: 1px; background: var(--color-line); }
.check { display: flex; align-items: center; gap: 8px; padding: 0 20px 12px; font-size: 13px; color: var(--color-muted); }
.box { width: 16px; height: 16px; border: 1.5px solid #8C93A0; display: grid; place-items: center; background: var(--color-surface); }
.box.on { background: var(--color-ink); border-color: var(--color-ink); color: #fff; }
.box .lucide { width: 12px; height: 12px; }

/* Anuncios */
.ann { margin: 8px 20px; background: var(--color-surface); border: 1px solid var(--color-line); box-shadow: var(--shadow-sm); }
.ann.pinned { border-top: 3px solid var(--color-primary); }
.ann-tag { display: flex; align-items: center; gap: 6px; padding: 8px 16px 0; font-size: 12px; color: var(--color-muted); font-weight: 500; }
.ann .msg { padding: 8px 16px 12px; }
.ann .msg:hover { background: transparent; }
.ann h3 { margin: 4px 0 2px; font-family: var(--font-display); font-size: 17px; }
.ack-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--color-line); background: #FBFAF7; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; font-weight: 700; font-size: 13px; border: 1px solid transparent; transition: background 160ms; }
.btn.primary { background: var(--color-primary); color: var(--color-ink); }
.btn.primary:hover { background: var(--color-primary-dark); }
.btn.ghost { border-color: var(--color-line); background: var(--color-surface); }
.btn.done { background: var(--color-success-light); color: var(--color-success); border-color: #B7DCC6; }
.progress { flex: 1; min-width: 120px; display: grid; gap: 4px; font-size: 12px; color: var(--color-muted); }
.bar { height: 6px; background: var(--color-line); }
.bar i { display: block; height: 100%; background: var(--color-ink); }
.ack-list .row { display: flex; align-items: center; gap: 10px; padding: 7px 20px; }
.ack-list .row .av { width: 28px; height: 28px; font-size: 11px; }
.ack-list .row small { margin-left: auto; color: var(--color-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tabs-in { display: flex; border-bottom: 1px solid var(--color-line); padding: 0 12px; }
.tabs-in span { padding: 10px 8px; font-size: 13px; font-weight: 500; color: var(--color-muted); border-bottom: 3px solid transparent; }
.tabs-in span.on { color: var(--color-ink); border-bottom-color: var(--color-primary); }

/* Manuales */
.doc-wrap { flex: 1; display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 0; }
.tree { background: var(--color-surface); border-right: 1px solid var(--color-line); padding: 12px 0; overflow: hidden; }
.tree .t { display: flex; align-items: center; gap: 6px; padding: 5px 14px; font-size: 13px; position: relative; }
.tree .t.l2 { padding-left: 32px; } .tree .t.l3 { padding-left: 50px; }
.tree .t.on { background: var(--color-primary-light); font-weight: 500; }
.tree .t.on::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--color-primary); }
.tree h5 { margin: 10px 14px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--color-muted); font-weight: 500; }
.doc { overflow: hidden; padding: 28px 48px; background: var(--color-surface); }
.doc .crumbs { font-size: 12px; color: var(--color-muted); display: flex; gap: 6px; align-items: center; }
.doc h1 { font-family: var(--font-display); font-size: 30px; margin: 8px 0 6px; text-wrap: balance; }
.doc .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 12px; color: var(--color-muted); padding-bottom: 16px; border-bottom: 1px solid var(--color-line); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; font-size: 12px; font-weight: 500; border: 1px solid var(--color-line); background: var(--color-canvas); color: var(--color-ink); }
.chip.vida { background: #EAF1F8; border-color: #C3D5E8; color: var(--color-leaf); }
.chip.salud { background: var(--color-success-light); border-color: #B7DCC6; color: var(--color-success); }
.chip.medicare { background: #F1ECF8; border-color: #D5CAE8; color: #5B4B8A; }
.doc h2 { font-family: var(--font-display); font-size: 19px; margin: 22px 0 8px; }
.doc p, .doc li { line-height: 1.6; max-width: 68ch; }
.doc ol { padding-left: 20px; }
.doc table { border-collapse: collapse; margin-top: 8px; font-size: 13px; }
.doc th, .doc td { border: 1px solid var(--color-line); padding: 6px 12px; text-align: left; }
.doc th { background: var(--color-canvas); font-weight: 500; }
.callout { display: flex; gap: 10px; padding: 10px 14px; background: var(--color-primary-light); border-left: 3px solid var(--color-primary); margin: 12px 0; max-width: 68ch; line-height: 1.5; }

/* Kanban */
.toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 12px 20px; }
.seg { display: flex; border: 1px solid var(--color-line); background: var(--color-surface); }
.seg span { padding: 6px 12px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.seg span.on { background: var(--color-ink); color: #fff; }
.toolbar .dd-l { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--color-line); background: var(--color-surface); font-size: 13px; }
.toolbar .btn { margin-left: auto; }
.board { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; padding: 0 20px 16px; overflow: hidden; min-height: 0; }
.col { background: #EDEAE3; display: flex; flex-direction: column; gap: 8px; padding: 10px; min-height: 0; }
.col-h { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; padding: 2px 2px 4px; }
.col-h .n { color: var(--color-muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.col-h .icon-btn { margin-left: auto; width: 26px; height: 26px; }
.card { background: var(--color-surface); border: 1px solid var(--color-line); padding: 10px 12px; display: grid; gap: 8px; box-shadow: var(--shadow-sm); transition: box-shadow 160ms, transform 160ms; }
.card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.card.over { border-left: 3px solid var(--color-danger); }
.card.dragging { transform: rotate(-1.5deg); box-shadow: var(--shadow-lg); }
.card .t { font-weight: 500; line-height: 1.35; }
.card .row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--color-muted); }
.card .row .stack { margin-left: auto; }
.due { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.due.over { color: var(--color-danger); font-weight: 700; }

function spark(vals, color) {
  const w = 150, h = 32, max = 130, step = w / (vals.length - 1);
  const pts = vals.map((v, i) => `${(i * step).toFixed(1)},${(h - 3 - (v / max) * (h - 6)).toFixed(1)}`);
  const goalY = (h - 3 - (100 / max) * (h - 6)).toFixed(1);
  const last = pts[pts.length - 1].split(',');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Tendencia de 12 semanas">
    <line x1="0" x2="${w}" y1="${goalY}" y2="${goalY}" stroke="#F69008" stroke-dasharray="3 3" stroke-width="1"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.75"/>
    <rect x="${+last[0] - 3}" y="${+last[1] - 3}" width="6" height="6" fill="${color}"/></svg>`;
}
const grow = (name, dept, line, actual, target, unit, trend) => {
  const pct = Math.round((actual / target) * 100);
  const cls = pct >= 90 ? 'g' : pct >= 70 ? 'a' : 'r';
  const color = { g: '#1E7F4F', a: '#B54708', r: '#B42318' }[cls];
  return `<div class="grow"><div class="name"><b>${name}</b><small>${dept}${line ? ` · <span class="chip ${line[0]}">${line[1]}</span>` : ''}</small></div>
    <div><b>${actual}</b> / ${target} <small style="color:var(--color-muted)">${unit}</small></div>
    <span class="light ${cls}">${pct} %</span>
    <div class="meter-c"><div class="meter"><i style="width:${Math.min(pct, 120) / 1.2}%"></i></div></div>
    <div class="spark-c">${spark(trend, color)}</div></div>`;
};

const tabsEl = document.getElementById('tabs');
const desk = document.getElementById('desk'), phone = document.getElementById('phone');
const deskScaler = document.getElementById('deskScaler'), phoneScaler = document.getElementById('phoneScaler');

function fit() {
  for (const [s, el, w, h] of [[deskScaler, desk, 1280, 800], [phoneScaler, phone, 390, 844]]) {
    const inner = s.clientWidth - (s === phoneScaler ? 20 : 0);
    const k = inner / w;
    el.style.transform = `scale(${k})`;
    s.style.height = `${h * k + (s === phoneScaler ? 20 : 0)}px`;
  }
}
function show(id) {
  const s = SCREENS.find((x) => x.id === id) || SCREENS[0];
  desk.innerHTML = s.d();
  phone.innerHTML = s.m();
  document.getElementById('notes').innerHTML =
    `<div><h2>${s.label}: qué revisar</h2><ul>${s.notes.map((n) => `<li>${n}</li>`).join('')}</ul></div>
     <div><h2>Reglas aplicadas en todas</h2><ul><li>Esquinas rectas en todo; solo el punto de presencia es redondo.</li><li>Texto marino sobre naranja (blanco sobre naranja no pasa AA).</li><li>Roboto en texto, Bricolage Grotesque en títulos; íconos Lucide; sin emojis en la interfaz (solo en reacciones y mensajes).</li><li>Desplegables propios, sin selectores nativos; áreas táctiles de 44 px en iPhone.</li></ul></div>`;
  tabsEl.querySelectorAll('button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.id === s.id)));
  try { localStorage.setItem('mockup-tab', s.id); } catch {}
  if (window.lucide) lucide.createIcons();
  fit();
}
tabsEl.innerHTML = SCREENS.map((s, i) => `<button role="tab" data-id="${s.id}"><span class="num">${i + 1}</span>${I(s.icon)}${s.label}</button>`).join('');
tabsEl.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.id); });
let start = location.hash.slice(1);
if (!start) { try { start = localStorage.getItem('mockup-tab'); } catch {} }
new ResizeObserver(fit).observe(deskScaler.parentElement);
show(start);
</script>
