# Entorno local de desarrollo. Puertos altos para no chocar con otros proyectos de la laptop.
name: agencia-hub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agencia
      POSTGRES_PASSWORD: ${PG_PASSWORD:-agencia_dev}
      POSTGRES_DB: agencia_hub
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-agencia_app_dev}
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agencia", "-d", "agencia_hub"]
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-agencia}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-agencia_dev_secret}
    ports: ["59000:9000", "59001:9001"]
    volumes: [minio:/data]

  # ponytail: Mailpit en vez de MailHog (MailHog está abandonado; misma función).
  mailpit:
    image: axllent/mailpit:latest
    ports: ["51025:1025", "58025:8025"]

volumes:
  pgdata:
  minio:
