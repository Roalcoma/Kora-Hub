# Producción (piloto en el servidor de Rodrigo). Sin puertos publicados al host: el túnel de Cloudflare entra por
# una red de Docker. Uso (desde ~/infra/kora, con .env al lado):
#   docker compose -f compose.prod.yml --env-file .env up -d
name: kora

services:
  app:
    image: ${KORA_IMAGE:-kora:local}
    container_name: kora-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4300"
      # Las URLs se componen aquí para que el .env no tenga que repetir contraseñas
      DATABASE_URL: postgres://agencia:${PG_PASSWORD:?}@postgres:5432/agencia_hub
      DATABASE_URL_APP: postgres://agencia_app:${APP_DB_PASSWORD:?}@postgres:5432/agencia_hub
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    mem_limit: 768m
    networks: [internal, tunnel]

  postgres:
    image: postgres:16-alpine
    container_name: kora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agencia
      POSTGRES_PASSWORD: ${PG_PASSWORD:?}
      POSTGRES_DB: agencia_hub
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agencia", "-d", "agencia_hub"]
      interval: 5s
      retries: 30
    mem_limit: 1g
    networks: [internal]

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: kora-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes: [minio:/data]
    mem_limit: 512m
    networks: [internal]

volumes:
  pgdata:
  minio:

networks:
  internal:
    # red por defecto (bridge): la app necesita salida a internet para SMTP y Telegram
  # Red donde vive el contenedor cloudflared (externa, ya existente en el servidor)
  tunnel:
    name: ${TUNNEL_NETWORK:-n8n_default}
    external: true
